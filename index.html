<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Login | Clínica Veterinária
    </title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main class="login-box">
      <h1>
        LOGIN
      </h1>
      <form action="inicio.html">
        <label for="usuario">
          Usuário
        </label>
        <input id="usuario" placeholder="Usuário" autocomplete="username" required>
        <label for="senha">
          Senha
        </label>
        <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
        <button class="button green" type="submit">
          ENTRAR
        </button>
        <small>
          Acesso demonstrativo, sem autenticação.
        </small>
      </form>
    </main>
  </body>
</html>
