<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Exames | Clínica Veterinária
    </title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="inicio.html">
        Clínica Veterinária
      </a>
      <a class="logout" href="index.html" aria-label="Sair">
        ⇥
      </a>
    </header>
    <nav aria-label="Menu principal">
      <a href="inicio.html">
        ⌂
      </a>
      <a href="cadastros.html">
        CADASTROS
      </a>
      <a href="consultas.html">
        CONSULTAS
      </a>
      <a href="tratamentos.html">
        TRATAMENTOS
      </a>
      <a href="exames.html" aria-current="page">
        EXAMES
      </a>
      <a href="historico.html">
        HISTÓRICO
      </a>
      <a href="compras.html">
        COMPRAS
      </a>
    </nav>
    <main>
      <div class="page-heading">
        <h1>
          Exames — novo registro
        </h1>
      </div>
      <form action="exames.html" method="get">
        <div class="form-grid">
          <div class="">
            <label for="campo-0">
              Paciente
            </label>
            <input id="campo-0" type="text">
          </div>
          <div class="">
            <label for="campo-1">
              Exame
            </label>
            <input id="campo-1" type="text">
          </div>
          <div class="">
            <label for="campo-2">
              Data
            </label>
            <input id="campo-2" type="date">
          </div>
          <div class="">
            <label for="campo-3">
              Situação
            </label>
            <select id="campo-3">
              <option>
                Agendado
              </option>
              <option>
                Em andamento
              </option>
              <option>
                Concluído
              </option>
            </select>
          </div>
          <div class="wide">
            <label for="campo-4">
              Observações
            </label>
            <textarea id="campo-4" rows="4">
            </textarea>
          </div>
        </div>
        <div class="actions">
          <button class="button green" type="submit">
            Concluir cadastro
          </button>
          <button class="button red" type="reset">
            Limpar
          </button>
          <a class="button" href="exames.html">
            Voltar
          </a>
        </div>
        <p class="note">
          Formulário demonstrativo. Os dados não são armazenados.
        </p>
      </form>
    </main>
    <footer>
      Protótipo visual • Dados ilustrativos
    </footer>
  </body>
</html>
